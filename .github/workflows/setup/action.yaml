name: 'openpilot env setup'

inputs:
  docker_hub_pat:
    description: 'Auth token for Docker Hub, required for BuildJet jobs'
    required: true
    default: ''
  is_retried:
    description: 'A mock param that asserts that we use the setup-with-retry instead of this action directly'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    # assert that this action is retried using the setup-with-retry
    - shell: bash
      if: ${{ inputs.is_retried == 'false' }}
      run: |
        echo "You should not run this action directly. Use setup-with-retry instead"
        exit 1

    # do this after checkout to ensure our custom LFS config is used to pull from GitLab
    - shell: bash
      run: git lfs pull

    # on BuildJet runners, must be logged into DockerHub to avoid rate limiting
    # https://buildjet.com/for-github-actions/docs/guides/docker
    - shell: bash
      if: ${{ contains(runner.name, 'buildjet') && inputs.docker_hub_pat == '' }}
      run: |
        echo "Need to set the Docker Hub PAT secret as an input to this action"
        exit 1
    - name: Login to Docker Hub
      if: contains(runner.name, 'buildjet')
      shell: bash
      run: |
        docker login -u adeebshihadeh -p ${{ inputs.docker_hub_pat }}

    # build cache
    - id: date
      shell: bash
      run: echo "CACHE_COMMIT_DATE=$(git log -1 --pretty='format:%cd' --date=format:'%Y-%m-%d-%H:%M')" >> $GITHUB_ENV
    - shell: bash
      run: echo "$CACHE_COMMIT_DATE"
    - id: scons-cache
      uses: ./.github/workflows/auto-cache
      with:
        path: .ci_cache/scons_cache
        key: scons-${{ runner.arch }}-${{ env.CACHE_COMMIT_DATE }}-${{ github.sha }}
        restore-keys: |
          scons-${{ runner.arch }}-${{ env.CACHE_COMMIT_DATE }}
          scons-${{ runner.arch }}
    # as suggested here: https://github.com/moby/moby/issues/32816#issuecomment-910030001
    - id: normalize-file-permissions
      shell: bash
      name: Normalize file permissions to ensure a consistent docker build cache
      run: |
        find . -type f -executable -not -perm 755 -exec chmod 755 {} \;
        find . -type f -not -executable -not -perm 644 -exec chmod 644 {} \;
    # Cache only the standard native base image; publishing and cross-builds
    # must run the original build. The tools workflow populates this cache to
    # avoid every parallel test job exporting the same large image.
    # Update the hash inputs when Dockerfile.openpilot_base adds a COPY.
    - id: image-cache-generation
      if: runner.os == 'Linux' && env.BUILD == 'selfdrive/test/docker_build.sh base' && env.BASE_IMAGE == 'openpilot-base' && env.PUSH_IMAGE == '' && env.TARGET_ARCHITECTURE == ''
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - name: Restore base image
      id: image-cache
      if: steps.image-cache-generation.outcome == 'success'
      uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/teletyped-openpilot-base.tar
        key: teletyped-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.image-cache-generation.outputs.week }}-${{ hashFiles('Dockerfile.openpilot_base', '.dockerignore', '.python-version', 'pyproject.toml', 'poetry.lock', 'tools/install_ubuntu_dependencies.sh', 'tools/install_python_dependencies.sh', 'selfdrive/test/docker_build.sh', 'selfdrive/test/docker_common.sh') }}
    - name: Load cached base image
      id: load-image
      if: steps.image-cache.outputs.cache-hit == 'true'
      continue-on-error: true
      shell: bash
      run: |
        trap 'rm -f "$RUNNER_TEMP/teletyped-openpilot-base.tar"' EXIT
        docker load --input "$RUNNER_TEMP/teletyped-openpilot-base.tar"
        docker image inspect "$BASE_IMAGE:latest" > /dev/null
        docker tag "$BASE_IMAGE:latest" ghcr.io/commaai/openpilot-base:latest
    # Build on a miss or failed load; weekly rotation refreshes upstream inputs.
    - shell: bash
      if: steps.load-image.outcome != 'success'
      run: eval ${{ env.BUILD }}
    - name: Export base image for future runs
      id: export-image
      if: github.workflow == 'tools' && steps.image-cache-generation.outcome == 'success' && steps.image-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      run: docker save --output "$RUNNER_TEMP/teletyped-openpilot-base.tar" "$BASE_IMAGE:latest"
    - name: Save base image
      if: steps.export-image.outcome == 'success'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/teletyped-openpilot-base.tar
        key: ${{ steps.image-cache.outputs.cache-primary-key }}
    - name: Remove exported image archive
      if: steps.export-image.outcome == 'success'
      shell: bash
      run: rm -f "$RUNNER_TEMP/teletyped-openpilot-base.tar"
