  process_replay_fork_i30:
    name: process replay (forked)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Cache scons
        id: scons-cache
        uses: actions/cache@v3
        with:
          path: /tmp/scons_cache
          key: scons-${{ hashFiles('.github/workflows/selfdrive_tests.yaml') }}-${{ github.sha }}
          restore-keys: |
            scons-${{ hashFiles('.github/workflows/selfdrive_tests.yaml') }}-
            scons-

      - name: Build Docker image
        run: eval "$BUILD"

      - name: Patch test_processes.py to use /tmp
        run: |
          echo "Updating get_log_data() path"
          sed -i 's|/data/media/0/realdata/fakedata/|/tmp/fakedata/|g' selfdrive/test/process_replay/test_processes.py

      #- name: Set OPENPILOT_PREFIX
        #run: echo "OPENPILOT_PREFIX=/tmp/openpilot" >> $GITHUB_ENV

      - name: Run process replay with update-refs
        run: |
          # Run the test command and capture both stdout and stderr to a log file
          {
            ${{ env.RUN }} "\
              unset FINGERPRINT && \
              git config --global --add safe.directory /tmp/openpilot && \
              git config --global --add safe.directory /tmp/openpilot/panda && \
              mkdir -p /tmp/fakedata/regenAA0FC4ED71E/2025-04-20--14-41-54/0 && \
              cp tools/testdata/rlog.bz2 /tmp/fakedata/regenAA0FC4ED71E/2025-04-20--14-41-54/0/rlog.bz2 && \
              ls -l /tmp/fakedata/regenAA0FC4ED71E/2025-04-20--14-41-54/0 && \
              scons -j$(nproc) --cache-populate && \
              FILEREADER_CACHE=1 python3 selfdrive/test/process_replay/test_processes.py --update-refs --whitelist-cars HYUNDAI --whitelist-procs calibrationd controlsd plannerd radard paramsd"
          } 2>&1 | tee process_replay.log

      - name: Check logs for crash indicators
        run: |
          # Look for known exception patterns that indicate failure
          if grep -E "Traceback|Exception in thread|capnp.*failed" process_replay.log; then
            echo "::error::Detected crash or exception in log output"
            exit 1
          fi

