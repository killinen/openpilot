repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
        exclude: "^(third_party/|frogpilot/third_party/|tinygrad/|tinygrad_repo/|msgq/|msgq_repo/|rednose/|rednose_repo/|panda/|opendbc/)"
      - id: check-yaml
        exclude: "^(third_party/|frogpilot/third_party/|tinygrad/|tinygrad_repo/|msgq/|msgq_repo/|rednose/|rednose_repo/|panda/|opendbc/)"
      - id: check-json
        exclude: "^(third_party/|frogpilot/third_party/|tinygrad/|tinygrad_repo/|msgq/|msgq_repo/|rednose/|rednose_repo/|panda/|opendbc/)"
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
      - id: ruff
        args:
          - --select=E9,F63,F7,F82
        exclude: "^(third_party/|frogpilot/third_party/|tinygrad/|tinygrad_repo/|msgq/|msgq_repo/|rednose/|rednose_repo/|panda/|opendbc/)"
